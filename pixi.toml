[workspace]
name = "scharcode"
version = "0.1.0"
description = "Code of Shor's algorithm as implemented for factorization in the paper [Shor's algorithm compiled on cat qubits: 22 593 qubits for RSA-2048 in 3.14 days]"
channels = ["conda-forge"]
# linux-aarch64 lets Docker on Apple Silicon use the same lock file
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
graphviz = "*"
numpy = "*"
scipy = "*"
sympy = "*"
attrs = "*"
pandas = "*"
jinja2 = "*"          # needed by pandas.DataFrame.to_latex
tectonic = ">=0.17.0,<0.18"

[pypi-dependencies]
qualtran = "==0.7.0"
scharcode = { path = ".", editable = true }

[tasks]
paper = "python scripts/make_paper_outputs.py"

# ---- test feature ----
[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"

[feature.test.tasks]
test = "pytest"
test-fast = "pytest -m 'not slow' -n auto"
cov = "pytest --cov=scharcode --cov-report=term-missing"

# ---- dev feature ----
[feature.dev.dependencies]
ruff = "*"
pre-commit = "*"
jupyterlab = "*"

[feature.dev.tasks]
lint = "ruff check ."
format = "ruff format ."

[environments]
# solve-group: all environments share the same versions of shared packages
default = { features = ["test", "dev"], solve-group = "main" }
test    = { features = ["test"], solve-group = "main" }
